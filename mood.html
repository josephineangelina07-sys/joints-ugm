<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SENJA — Mood harian</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/mood.css" />
</head>
<body data-page="mood">
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <svg class="logo" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="24" cy="24" r="21" stroke="#2f3e9e" stroke-width="2.5"/>
          <path d="M14 20c3-4 7-5 11-3M12 27c5 3 12 3 20-1M18 33c4 1 9 0 13-3" stroke="#6d57c0" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
        <span class="brand-name">SENJA</span>
      </div>
      <nav class="nav">
        <a href="index.html" data-nav="beranda">Beranda</a>
        <a href="skrining.html" data-nav="skrining">Skrining</a>
        <a href="mood.html" data-nav="mood">Mood harian</a>
        <a href="tren.html" data-nav="tren">Tren</a>
      </nav>
    </aside>

    <main class="main">
      <div class="main-inner">
        <header class="page-head">
          <h1>Catat mood hari ini</h1>
          <p>Satu menit untuk mengenali dirimu sendiri.</p>
        </header>

        <div class="side-layout">
          <section class="card mood-form">
            <h3 class="section-title">Perasaanmu sekarang</h3>
            <div class="moods" id="moodMoods">
              <button class="mood" data-mood="berat"><span class="face m1">😣</span><span class="label">Berat</span></button>
              <button class="mood" data-mood="kurang"><span class="face m2">🙁</span><span class="label">Kurang baik</span></button>
              <button class="mood active" data-mood="biasa"><span class="face m3">😐</span><span class="label">Biasa</span></button>
              <button class="mood" data-mood="baik"><span class="face m4">🙂</span><span class="label">Baik</span></button>
              <button class="mood" data-mood="cerah"><span class="face m5">😄</span><span class="label">Cerah</span></button>
            </div>

            <h3 class="section-title">Apa yang memengaruhi?</h3>
            <div class="row tags" id="factors" style="flex-wrap:wrap">
              <span class="chip active">Kuliah</span>
              <span class="chip">Kerja</span>
              <span class="chip active">Tidur</span>
              <span class="chip">Keluarga</span>
              <span class="chip">Teman</span>
            </div>

            <h3 class="section-title">Catatan singkat</h3>
            <textarea class="note" id="moodNote" placeholder="Apa yang terjadi hari ini?"></textarea>

            <button class="btn btn-primary" id="saveBtn" style="margin-top:18px">Simpan</button>
          </section>

          <aside class="card recent">
            <h2>Catatan terakhir</h2>
            <div id="recentList">
              <p class="muted small">Belum ada catatan. Mood yang kamu simpan akan muncul di sini.</p>
            </div>
          </aside>
        </div>
      </div>
    </main>
  </div>

  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
  <script src="js/mood.js"></script>
</body>
</html>
